<title>Blights Real Estate × McGrath Foundation Lucky Squares</title>
<style>
:root{--purple:#812183;--pink:#ef168c;--navy:#07143d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--navy);overflow:hidden}
body:before{
  content:"";position:fixed;inset:-24px;z-index:-2;
  background:url("TARGET_MOCKUP.png") center center/cover no-repeat;
  filter:blur(18px) saturate(.9);
  transform:scale(1.05);
}
body:after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:rgba(255,255,255,.16);
}
#viewport{position:relative;width:100vw!important;height:100vh!important;margin:0;overflow:hidden;background:transparent}
#stage{
  position:absolute;left:0;top:0;width:1536px;height:1024px;
  transform-origin:top left;
  background:url("TARGET_MOCKUP.png") 0 0/1536px 1024px no-repeat;
  box-shadow:0 0 55px rgba(83,32,111,.20);
}
#grid{
  position:absolute;left:189px;top:291px;width:689px;height:589px;
  display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(20,1fr);
  column-gap:5px;row-gap:5px;
  background:#fff;
}
.sq{
  border:1px solid #c9d1df;border-radius:5px;background:#fff;color:#07143d;
  font-size:11px;line-height:1;font-weight:500;display:grid;place-items:center;
  padding:0;cursor:pointer;position:relative;overflow:hidden;
}
.sq:hover:not(:disabled){border:2px solid #ef168c}
.sq.selected{background:linear-gradient(135deg,#ff7db6,#ef168c);color:#fff;border-color:#ef168c;font-weight:800}
.sq.sold{background:linear-gradient(135deg,#76217e,#98288f);border-color:#76217e;color:transparent;cursor:not-allowed}
.ribbon{
  display:none;
  position:absolute;
  left:50%;top:50%;
  width:15px;height:20px;
  transform:translate(-50%,-50%);
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2064%22%3E%0A%3Cpath%20d%3D%22M15%2055%0AC19%2045%2027%2036%2033%2027%0AC39%2018%2037%209%2028%208%0AC19%207%2012%2013%2012%2021%0AC12%2030%2021%2036%2028%2041%0AL38%2055%22%0Afill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%227.5%22%0Astroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E") center/contain no-repeat;
}
.sold .ribbon{display:block}
.ribbon:before,.ribbon:after,.ribbon i,.ribbon i:after{
  display:none!important;content:none!important;
}
/* live selection panel overlays the mockup's example values */
#chosen{
  position:absolute;left:927px;top:289px;width:277px;height:65px;border-radius:8px;
  background:#ffd1e3;display:grid;place-items:center;font-size:39px;font-weight:900;
}
.field{position:absolute;left:927px;width:277px;height:35px;border:1px solid #bdc7d7;border-radius:5px;background:#fff;padding:0 12px;font-size:12px;color:#333}
#first{top:387px}#last{top:455px}#email{top:531px}#phone{top:605px}
#hold{
  position:absolute;left:927px;top:653px;width:277px;height:55px;border:0;border-radius:7px;
  background:linear-gradient(90deg,#ef168c,#f52b84);color:#fff;font-size:18px;font-weight:800;cursor:pointer;
}
#hold:hover{filter:brightness(1.03)}
/* live totals cover the mockup's zero placeholders only */
.liveStat{position:absolute;background:#fdfbfe;font-weight:900;text-align:left;display:flex;align-items:center;padding-left:2px}
#soldCount{left:606px;top:168px;width:57px;height:31px;font-size:23px}
#pct{left:773px;top:168px;width:65px;height:31px;font-size:23px}
#raised{left:944px;top:168px;width:93px;height:31px;font-size:23px}
/* mask the mockup's example selection before drawing the live value */
.cover138{position:absolute;left:927px;top:289px;width:277px;height:65px;background:#ffd1e3;border-radius:8px}

/* Replace the AI-rendered McGrath mark in the mockup with the user's correct logo. */
#mcgrathLogoFix{
  position:absolute;
  left:495px;top:18px;
  width:310px;height:112px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  z-index:3;
}
#mcgrathLogoFix img{
  width:225px;height:auto;
  margin-left:-35px;
  image-rendering:auto;
}

dialog{border:0;border-radius:16px;padding:0;width:min(460px,calc(100% - 24px));box-shadow:0 30px 90px #0008}
dialog::backdrop{background:#07143d99}
.modal{padding:22px}.timer{background:#fff0f6;color:#7b207f;border-radius:9px;padding:10px;font-weight:900}
.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;border:0;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}
.cancel{background:#edf1f5}.pay{background:#ef168c;color:#fff}.msg{font-size:12px;color:#59647a;margin-top:8px}
@media(max-width:650px){
  html,body{background:transparent}
  /* still preserve the exact desktop composition; user can scroll horizontally on very small phones */
}
</style>

<script>
const CONFIG={
  apiEndpoint:"https://script.google.com/macros/s/AKfycbyU7Akr6BXGC-18PlPhd6fV-MFAexMDR1g6WJGVHkePf-sUIvr0hxi_w3OivguT1JU4pg/exec",
  totalSquares:300,
  price:20,
  holdMinutes:10,
  demoSold:[5,24,38,71,88,121,178,200,204,251,295]
};

const BASE_W=1536, BASE_H=1024;
const viewport=document.getElementById("viewport");
const stage=document.getElementById("stage");

function fitStage(){
  const w=window.innerWidth, h=window.innerHeight;
  // Fill the browser as much as possible while preserving the exact 1536×1024 layout.
  const scale=Math.min(w/BASE_W,h/BASE_H);
  const scaledW=BASE_W*scale, scaledH=BASE_H*scale;
  const left=Math.max(0,(w-scaledW)/2);
  const top=Math.max(0,(h-scaledH)/2);
  stage.style.left=left+"px";
  stage.style.top=top+"px";
  stage.style.transform=`scale(${scale})`;
}
window.addEventListener("resize",fitStage);
fitStage();

let state={},selected=null,token=null,expires=0,clock=null;
let clientId=localStorage.getItem("bmClient") ||
  (crypto.randomUUID ? crypto.randomUUID() : "c"+Date.now());
localStorage.setItem("bmClient",clientId);

const grid=document.getElementById("grid");
const dlg=document.getElementById("dlg");
const chosen=document.getElementById("chosen");
const first=document.getElementById("first");
const last=document.getElementById("last");
const email=document.getElementById("email");
const phone=document.getElementById("phone");
const hold=document.getElementById("hold");
const soldCount=document.getElementById("soldCount");
const pct=document.getElementById("pct");
const raised=document.getElementById("raised");
const dsq=document.getElementById("dsq");
const tm=document.getElementById("tm");
const pay=document.getElementById("pay");
const cancel=document.getElementById("cancel");
const dmsg=document.getElementById("dmsg");

async function api(action,payload={}){
  if(!CONFIG.apiEndpoint) throw Error("Preview mode — backend not connected yet.");
  const r=await fetch(CONFIG.apiEndpoint,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action,clientId,...payload})
  });
  const d=await r.json();
  if(!d.ok) throw Error(d.error||"Request failed");
  return d;
}

async function load(){
  // Draw the grid first so an Apps Script problem can never make it disappear.
  render();

  if(!CONFIG.apiEndpoint){
    state={};
    CONFIG.demoSold.forEach(n=>state[n]={status:"paid"});
    render();
    return;
  }

  try{
    const d=await api("list");
    state=d.squares||{};
    render();
  }catch(e){
    console.warn("Backend list failed:",e);
    // Keep the grid visible and usable while reporting the API error in console.
  }
}

function render(){
  grid.innerHTML="";
  let count=0;
  for(let n=1;n<=300;n++){
    const st=state[n];
    if(st?.status==="paid") count++;
    const b=document.createElement("button");
    b.className="sq";
    b.type="button";
    b.setAttribute("aria-label","Square "+n);
    b.innerHTML=`<span>${n}</span><span class="ribbon"><i></i></span>`;
    if(st?.status==="paid"){
      b.classList.add("sold"); b.disabled=true;
    }else if(st?.status==="held"){
      b.disabled=true; b.style.background="#fff1b9";
    }else{
      b.onclick=()=>choose(n);
    }
    if(n===selected) b.classList.add("selected");
    grid.appendChild(b);
  }
  soldCount.textContent=count;
  pct.textContent=Math.round((count/300)*100)+"%";
  raised.textContent="$"+(count*20).toLocaleString("en-AU");
}

function choose(n){
  selected=n;
  chosen.textContent=n;
  render();
}

hold.onclick=async()=>{
  if(!selected){ alert("Choose an available square first."); return; }
  if(!first.value.trim()||!last.value.trim()||!email.value.trim()||!phone.value.trim()){
    alert("Please complete your first name, last name, email address and phone number.");
    return;
  }
  try{
    if(!CONFIG.apiEndpoint){
      token="preview";
      expires=Date.now()+600000;
    }else{
      const d=await api("hold",{
        square:selected,
        firstName:first.value.trim(),
        lastName:last.value.trim(),
        email:email.value.trim(),
        phone:phone.value.trim()
      });
      token=d.holdToken;
      expires=d.holdExpiresAt;
    }
    dsq.textContent="#"+selected;
    dlg.showModal();
    startClock();
    await load();
  }catch(e){ alert(e.message); }
};

function startClock(){
  clearInterval(clock);
  tick();
  clock=setInterval(tick,1000);
}
function tick(){
  const left=Math.max(0,expires-Date.now());
  const sec=Math.ceil(left/1000);
  tm.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
  if(!left){
    clearInterval(clock);
    pay.disabled=true;
    dmsg.textContent="Hold expired. Please choose the square again.";
  }
}

pay.onclick=async()=>{
  if(!CONFIG.apiEndpoint){
    dmsg.textContent="Preview mode — Square is not connected yet.";
    return;
  }
  pay.disabled=true;
  try{
    const d=await api("createCheckout",{
      square:selected,holdToken:token,
      firstName:first.value.trim(),lastName:last.value.trim(),
      email:email.value.trim(),phone:phone.value.trim()
    });
    location.href=d.paymentLink;
  }catch(e){
    dmsg.textContent=e.message;
    pay.disabled=false;
  }
};

cancel.onclick=async()=>{
  clearInterval(clock);
  if(CONFIG.apiEndpoint&&selected&&token){
    try{await api("release",{square:selected,holdToken:token})}catch(e){}
  }
  dlg.close();
  token=null;
  await load();
};

load();
if(CONFIG.apiEndpoint) setInterval(load,15000);
</script>
</body>
</html>
